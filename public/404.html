<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#1e88e5" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Little Garage · Road closed</title>
    <!-- Served by Cloudflare Pages with a 404 status for any path that is not a real file.
         The game itself uses hash routes (#/zone/…), so real players never land here. -->
    <style>
      :root { --ink: #263238; --paper: #fff8e1; --go: #43a047; --warn: #fb8c00; color-scheme: light; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--paper); color: var(--ink);
        font-family: 'SF Pro Rounded', ui-rounded, 'Arial Rounded MT Bold', 'Nunito', system-ui, sans-serif;
        display: flex; align-items: center; justify-content: center; text-align: center;
        padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      }
      main { max-width: 560px; }
      .sign { font-size: clamp(72px, 18vmin, 140px); line-height: 1; }
      h1 { font-size: clamp(28px, 6vmin, 44px); margin: 16px 0 4px; }
      p { font-size: clamp(17px, 3.4vmin, 22px); margin: 0 0 6px; opacity: 0.8; }
      a.go {
        display: inline-block; margin-top: 24px; padding: 18px 36px; border-radius: 28px;
        background: var(--go); color: #fff; font-size: clamp(22px, 4.5vmin, 30px); font-weight: 700;
        text-decoration: none; box-shadow: 0 6px 0 rgba(38, 50, 56, 0.18);
      }
      a.go:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(38, 50, 56, 0.18); }
    </style>
  </head>
  <body>
    <main>
      <div class="sign" aria-hidden="true">🚧🚗</div>
      <h1>Road closed!</h1>
      <p>This road doesn’t go anywhere.</p>
      <p lang="vi">Đường này không có lối đi.</p>
      <a class="go" href="/">🏠 Back to the garage</a>
    </main>
  </body>
</html>
